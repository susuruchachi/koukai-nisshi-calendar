// 航海日誌の Android アプリ（WebView 版）
// 中身はウェブ版（GitHub Pages）を Android の内蔵部品（Android System WebView）で表示する。
// 画面の中身はウェブ版を更新すれば自動で新しくなる。APK を作り直すのは、このフォルダー（ウィジェットなど）を変えたときだけ。
// 作り直すときは versionCode を1つ上げる。GitHub Actions（android-apk）が app-bridge.js の ANDROID_APK_CODE も同じ数にして、
// 入っているアプリが自動で更新される（手元で作ったときは、ANDROID_APK_CODE を自分で同じ数にする）
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.susuruchachi.koukainisshi'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.susuruchachi.koukainisshi'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '1.7.0'

        def host = 'susuruchachi.github.io'
        def path = '/koukai-nisshi-calendar/'
        resValue 'string', 'appName', '航海日誌'
        resValue 'string', 'calWidgetName', '航海日誌 カレンダー'
        resValue 'string', 'calWidgetDescription', '今月のカレンダーと今日の予定'
        resValue 'string', 'diaryWidgetName', '航海日誌 できた事日記'
        resValue 'string', 'diaryWidgetDescription', '今日できた事と、すするanki で解いた数'
        resValue 'string', 'starWidgetName', '航海日誌 大事な予定'
        resValue 'string', 'starWidgetDescription', '★を付けた予定と、あと何日'
        resValue 'string', 'launchUrl', "https://${host}${path}?source=app"
        resValue 'string', 'loginUrl', "https://${host}${path}app-login.html"
        resValue 'string', 'hostName', host
        resValue 'string', 'pathPrefix', path
        // Google ログイン（アカウントを選ぶ画面）に使う、Firebase プロジェクト（susuruanki）の「ウェブ クライアント ID」（秘密ではない。すするanki と同じ）
        // ★ Firebase に、このアプリ（io.github.susuruchachi.koukainisshi）と署名の SHA-1 を Android アプリとして登録しておかないと、Google に断られる
        //    （そのときはブラウザでのログイン（app-login.html）を使う）
        resValue 'string', 'webClientId', '926791749187-pq139a7m09tnp8pupfineqp8ibruhu9v.apps.googleusercontent.com'
    }

    signingConfigs {
        release {
            // 署名鍵は環境変数で渡す（GitHub Actions では Secrets の KOUKAI_KEYSTORE_B64 / KOUKAI_KEYSTORE_PASSWORD から）。
            // 無ければデバッグ用の鍵で署名する（その APK は、前に入れたアプリの上から入れ直せない）
            def ks = System.getenv('KOUKAI_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KOUKAI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KOUKAI_KEY_ALIAS') ?: 'koukainisshi'
                keyPassword System.getenv('KOUKAI_KEY_PASSWORD') ?: System.getenv('KOUKAI_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KOUKAI_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
